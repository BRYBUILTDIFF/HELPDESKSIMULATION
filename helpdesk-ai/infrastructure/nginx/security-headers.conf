# Include inside the HTTPS frontend server block; replace the two origins.
# CSP in response headers is required for frame-ancestors.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.example.invalid; frame-src https://lab.example.invalid; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# On the Guacamole virtual host: exclude query strings from access logs.
# Define in http {}: log_format lab_safe '$remote_addr $request_method $uri $status';
# Then in its server {}: access_log /var/log/nginx/lab_access.log lab_safe;
